apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: server-secrets
  namespace: smarthire
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gcp-secret-store
    kind: ClusterSecretStore
  target:
    name: server-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: smarthire-secret
