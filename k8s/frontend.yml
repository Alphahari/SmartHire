apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: smarthire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alpha1717/smarthire:frontend:v5
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smarthire-config
            - secretRef:
                name: server-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: smarthire
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000