apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smarthire
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: alpha1717/client-side:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: server-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smarthire
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
  type: ClusterIP