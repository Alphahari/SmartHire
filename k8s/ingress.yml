apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smarthire-ingress
  namespace: smarthire
spec:
  ingressClassName: nginx
  rules:
    - host: smarthire.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000