apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-d eployment
  namespace: smarthire
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: alpha1717/smarthire-server:v5
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: server-secrets
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 2

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: smarthire
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000